[rules]
# 中文短名保留开关；关闭后所有载具优先走官方英文名。
preserve_chinese=1
chinese_max_length=12
# 从 assets/vehicle_meta.dat / cache/vehicle_meta.ini 的 DisplayName 取官方名。
use_official_name=1
# 列表内自动消除重名（变体后缀小写、斜杠两侧无空格）。
unique_titles=1
variant_lower=1

