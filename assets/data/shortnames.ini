# 战雷涂装管理器 - 名称映射表（可直接编辑，保存后重启程序生效）
# 格式：
#   [meta]     数据版本头（schemaVersion / dataVersion）
#   [nations]  国家代码=界面显示名
#   [short]    载具ID=简称     （也支持 全名=简称；优先级最高，可逐条人工覆盖）
#   [rules]    简称生成开关
#   [prefixes] 每行一个装备类别前缀，提取简称时会被去掉
#
# 简称生成优先级（从高到低）：
#   1. [short] 手工配置（按 slug 或中文全名）；
#   2. 已去掉类别前缀的中文简称：含中文、长度不超过 chinese_max_length，保留；
#   3. 上一轮 Wiki 采集数据里按 slug 精确对齐的官方英文名；
#   4. 游戏内全名去掉类别前缀，取变体斜杠前；
#   5. 回退全名，并写入安装目录的 shortnames_unmatched.txt。
#   同一简称出现多台时：名称自带 /变体 的优先；否则取全名斜杠后的变体标识（小写，
#   斜杠两侧不留空格，如 M1A2 SEPv2/战利品hv），仍冲突再追加机型代号差异段。
#   例：cn_ztz_99a → ZTZ99A；cn_zbd_04a → ZBD04A；fa_18e_block_2 → F/A-18E；
#       su_34 → 苏-34；j_10a → 歼-10A；ef_2000_fgr4 → 台风 FGR.4。

