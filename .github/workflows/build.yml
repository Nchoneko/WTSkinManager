name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Check version source
        run: npm run check:version

      - name: Prepare signing certificate
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WTSM_SIGN_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WTSM_SIGN_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PFX_BASE64)) {
            Write-Host '未配置签名证书，跳过签名（无证书构建是受支持的默认路径）'
            exit 0
          }
          $path = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:PFX_BASE64))
          "WTSM_SIGN_PFX=$path" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "WTSM_SIGN_PASSWORD=$env:PFX_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Diagnostics
        shell: pwsh
        run: |
          Write-Host ("PowerShell: " + $PSVersionTable.PSVersion.ToString())
          Write-Host ("csc exists: " + (Test-Path 'C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe'))
          Write-Host ("sign cert configured: " + (-not [string]::IsNullOrWhiteSpace($env:WTSM_SIGN_PFX)))
          Get-PSDrive C | ForEach-Object { Write-Host ("disk free: " + [math]::Round($_.Free/1GB,1) + " GB") }

      - name: Build
        shell: pwsh
        run: |
          npm run build 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { throw "build 失败，退出码 $LASTEXITCODE" }

      - name: Security regression tests
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/security-tests.ps1 -Exe "out/WTSkinManager.exe"

      - name: Verify signature (when certificate configured)
        shell: pwsh
        env:
          WTSM_SIGN_THUMBPRINT: ${{ secrets.WTSM_SIGN_THUMBPRINT }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WTSM_SIGN_PFX)) {
            Write-Host '无证书，跳过签名校验'
            exit 0
          }
          $sig = Get-AuthenticodeSignature 'out/WTSkinManager.exe'
          if ($sig.Status -eq 'NotSigned' -or $null -eq $sig.SignerCertificate) {
            throw "已配置签名证书，但产物没有签名（状态：$($sig.Status)）"
          }
          Write-Host ("签名状态：" + $sig.Status + "；签名者：" + $sig.SignerCertificate.Subject)
          if (-not [string]::IsNullOrWhiteSpace($env:WTSM_SIGN_THUMBPRINT)) {
            $expected = $env:WTSM_SIGN_THUMBPRINT.Replace(' ', '').ToUpperInvariant()
            $actual = $sig.SignerCertificate.Thumbprint.Replace(' ', '').ToUpperInvariant()
            if ($expected -ne $actual) { throw "签名证书指纹不匹配" }
          }
          if ($sig.Status -ne 'Valid' -and $sig.Status -ne 'UnknownError') {
            throw "签名校验失败：$($sig.Status)"
          }

      - name: Generate checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash 'out/WTSkinManager.exe' -Algorithm SHA256).Hash.ToLower()
          "$hash  WTSkinManager.exe" | Out-File -FilePath 'out/WTSkinManager.exe.sha256' -Encoding ascii
          Get-Content 'out/WTSkinManager.exe.sha256'

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WTSkinManager
          path: |
            out/WTSkinManager.exe
            out/WTSkinManager.exe.sha256
          if-no-files-found: error

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: WTSkinManager
          path: out

      - name: Generate release notes
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build/release-notes.ps1 -Tag "${{ github.ref_name }}"

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "out/WTSkinManager.exe" `
            "out/WTSkinManager.exe.sha256" `
            "assets/data/updates.dat" `
            --title "WTSkinManager ${{ github.ref_name }}" `
            --notes-file "out/release-notes.md"
