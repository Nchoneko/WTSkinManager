name: Bug 报告
description: 程序异常、界面问题、导入/管理功能失效
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提交前请先搜索是否已有同类 issue，并尽量附上截图与日志。
  - type: input
    id: version
    attributes:
      label: 程序版本
      description: 主界面标题右侧显示的版本号，例如 v3.9.1
      placeholder: v3.9.1
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: Windows 11 23H2 / 150% 缩放
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 按顺序写出你做了什么，越具体越好
      placeholder: |
        1. 打开程序
        2. 拖入 xxx.zip
        3. 点击导入
        4. 出现报错
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 有截图或错误提示请一并粘贴
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志（可选）
      description: 安装目录 logs\import.log、logs\installer.log 中与本问题相关的片段
      render: text
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已阅读 README 的常见问题与免责声明
          required: true
        - label: 我使用的是最新 Release 版本
          required: false
