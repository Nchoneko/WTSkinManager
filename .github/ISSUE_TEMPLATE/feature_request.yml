name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 先描述痛点，再描述功能，避免只写"加一个功能"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的做法
      description: 界面、交互、数据来源等
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案（可选）
  - type: textarea
    id: extra
    attributes:
      label: 补充信息（可选）
      description: 截图、参考链接、载具示例等
